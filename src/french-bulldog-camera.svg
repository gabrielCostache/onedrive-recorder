<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Bulldog francez tigrat care filmează</title>
  <defs>
    <clipPath id="face"><path d="M24 43 17 17Q15 8 24 13L43 26Q64 17 85 26l19-13q9-5 7 4l-7 27q4 15 1 31-5 29-31 38-13 5-26 0-26-9-31-38-3-16 1-32Z"/></clipPath>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c8cbd0"/><stop offset="1" stop-color="#858b94"/></linearGradient>
    <linearGradient id="muzzle" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e4e5e7"/><stop offset="1" stop-color="#b7bbc1"/></linearGradient>
  </defs>
  <style>
    .head{transform-origin:64px 72px;animation:bob 3.8s ease-in-out infinite}
    .earL{transform-origin:23px 24px;animation:ear 4s ease-in-out infinite}
    .earR{transform-origin:105px 24px;animation:ear 4s ease-in-out infinite;animation-delay:.12s}
    .eyes{transform-origin:64px 64px;animation:blink 5.5s infinite}
    .rec{animation:rec 1.1s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(1.5px) rotate(-1deg)}}
    @keyframes ear{0%,90%,100%{transform:rotate(0)}94%{transform:rotate(-5deg)}}
    @keyframes blink{0%,42%,46%,82%,86%,100%{transform:scaleY(1)}44%,84%{transform:scaleY(.12)}}
    @keyframes rec{0%,100%{opacity:1}50%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g class="head">
    <path class="earL" fill="#666c75" d="M21 42 16 18q-1-7 6-3l22 16Z"/>
    <path class="earR" fill="#666c75" d="m107 42 5-24q1-7-6-3L84 31Z"/>
    <path fill="url(#fur)" stroke="#545a63" stroke-width="2.5" stroke-linejoin="round" d="M24 43 17 17Q15 8 24 13L43 26Q64 17 85 26l19-13q9-5 7 4l-7 27q4 15 1 31-5 29-31 38-13 5-26 0-26-9-31-38-3-16 1-32Z"/>
    <g clip-path="url(#face)" fill="none" stroke="#555c65" stroke-width="5" stroke-linecap="round" opacity=".74">
      <path d="M29 30q8 13 2 25M42 24q8 13 3 25M84 25q-8 13-3 25M98 30q-8 13-2 25M23 62q9 10 5 22M105 62q-9 10-5 22M39 83q8 5 8 16M89 83q-8 5-8 16"/>
    </g>
    <path fill="#727881" d="M27 55q9-9 22-2l-3 15q-10 5-19-2Zm52-2q13-7 22 2l-1 11q-9 7-19 2Z"/>
    <g class="eyes" fill="#252930"><ellipse cx="38" cy="61" rx="5" ry="6"/><ellipse cx="90" cy="61" rx="5" ry="6"/><circle cx="40" cy="59" r="1.5" fill="#fff"/><circle cx="92" cy="59" r="1.5" fill="#fff"/></g>
    <path fill="url(#muzzle)" d="M31 74q8-12 22-9 11 2 11 12 0-10 11-12 14-3 22 9-3 18-17 23-10 4-16-5-6 9-16 5-14-5-17-23Z"/>
    <path fill="#333840" d="M51 74q13-9 26 0 0 8-13 10-13-2-13-10Z"/><path fill="#171a1e" d="M57 77q7-5 14 0-1 4-7 4t-7-4Z"/>
    <path d="M64 85v7m0 0q-5 5-11 0m11 0q5 5 11 0" fill="none" stroke="#555a62" stroke-width="2.5" stroke-linecap="round"/>
    <path fill="#737982" d="M37 99q27 14 54 0l-5 13q-22 10-44 0Z"/>
  </g>
  <g transform="translate(82 5)">
    <rect x="2" y="7" width="34" height="25" rx="7" fill="#333840" stroke="#f1f2f3" stroke-width="2"/>
    <path d="M36 13 46 8v23l-10-5Z" fill="#555b64" stroke="#f1f2f3" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="15" cy="19.5" r="7" fill="#89919a" stroke="#d9dce0" stroke-width="2"/><circle cx="15" cy="19.5" r="3.2" fill="#3d454e"/>
    <circle class="rec" cx="29" cy="13" r="3.2" fill="#ef4e52"/>
  </g>
</svg>
